name: RepoScribe quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Build, test, and validate documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Run end-to-end generation smoke test
        run: pnpm test:e2e

      - name: Validate documentation coverage
        id: coverage
        continue-on-error: true
        run: node scripts/run-docgen.cjs validate --json > doc-report.json

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doc-coverage-report
          path: doc-report.json

      - name: Comment on the pull request
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('doc-report.json')) return;
            const report = JSON.parse(fs.readFileSync('doc-report.json', 'utf8'));
            if (report.error) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## FAIL: RepoScribe documentation validation\n\n${report.error}`,
              });
              return;
            }
            const hasErrors = report.violations.some(v => v.level === 'error');
            const passed = !hasErrors && (!report.coverage.enforced || report.coverage.passed);
            const icon = passed ? (report.coverage.passed ? 'PASS' : 'ADVISORY') : 'FAIL';
            const body = [
              `## ${icon}: RepoScribe documentation validation`,
              '',
              `Coverage: **${report.coverage.overall}%** (threshold: ${report.coverage.threshold}%)`,
              `Violations: **${report.violations.length}**`,
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Enforce validation result
        if: steps.coverage.outcome == 'failure'
        run: exit 1
